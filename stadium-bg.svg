<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#010806"/><stop offset=".55" stop-color="#03170c"/><stop offset="1" stop-color="#020805"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#00ff58" stop-opacity=".38"/><stop offset="1" stop-color="#00ff58" stop-opacity="0"/></radialGradient>
 <linearGradient id="pitch" x2="0" y2="1"><stop stop-color="#0b411d"/><stop offset="1" stop-color="#03170b"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#32ff69" stop-opacity=".0"/><stop offset=".5" stop-color="#32ff69" stop-opacity=".22"/><stop offset="1" stop-color="#32ff69" stop-opacity="0"/></linearGradient>
 <pattern id="grass" width="22" height="28" patternUnits="userSpaceOnUse"><path d="M3 28l5-14m2 14 5-18m4 18 2-10" stroke="#38ef61" stroke-opacity=".13" stroke-width="2"/></pattern>
